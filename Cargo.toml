[workspace]
resolver = "3"
members = ["crates/usos-core", "crates/usos-store", "crates/usos-cli", "crates/usos-ffi", "crates/usos-desktop"]

[workspace.package]
license = "GPL-3.0-or-later"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
usos-core = { path = "crates/usos-core" }
usos-store = { path = "crates/usos-store" }

anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.4"
hmac = "0.13"
humantime = "2"
percent-encoding = "2"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "process"] }
toml = "1"
url = "2"
zeroize = "1"

[profile.release]
lto = "thin"
