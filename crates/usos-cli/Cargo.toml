[package]
name = "usos-cli"
description = "Command-line front end for LibreUSOS (unofficial USOS API client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "usos"
path = "src/main.rs"

[features]
# Bundled Mozilla roots instead of the platform verifier (see usos-core).
webpki-roots = ["usos-core/webpki-roots"]

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
dirs.workspace = true
humantime.workspace = true
serde_json.workspace = true
tokio.workspace = true
usos-core.workspace = true
usos-store.workspace = true
