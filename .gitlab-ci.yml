# Release builds: tag pipelines (with release) and manual "Run pipeline" (build only).
# Merge request pipelines run the tests and the desktop builds, when the code they build changes.
# The build logic is in ci/*.sh; variables are listed at https://gitlab.com/libreusos/LibreUSOS/-/wikis/Releasing.

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - build
  - release

build-linux:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  image: rust:1.99.1-alpine3.23
  script: ci/build-linux.sh
  artifacts:
    paths: [dist/]
    expire_in: never

build-windows:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  image: rust:1.99.1-alpine3.23
  script: ci/build-windows.sh
  artifacts:
    paths: [dist/]
    expire_in: never

# Desktop app (GPUI). Merge request pipelines build without an embedded consumer key, and their
# artifacts expire; only tag and manual builds keep theirs (the release links to them).
.desktop-release:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  artifacts:
    paths: [dist/]
    expire_in: never

.desktop-mr:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["crates/**/*", "Cargo.toml", "Cargo.lock", "ci/**/*", ".gitlab-ci.yml"]
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# fmt, clippy (desktop crate) and the workspace tests.
test:
  extends: [.desktop-mr]
  image: rust:1.99.1-bookworm
  script: ci/test.sh
  artifacts: null

.desktop-linux:
  image: rust:1.99.1-bookworm
  script: ci/build-desktop-linux.sh

# GPUI compiles its Direct3D shaders with the Windows SDK's fxc.exe in a build script that only runs on
# a Windows host, so this one builds natively (MSVC) on the SaaS Windows runner, not cross on Linux.
.desktop-windows:
  tags: [saas-windows-medium-amd64]
  timeout: 2h
  variables:
    RUST_VERSION: "1.99.1"  # keep in sync with the rust:* images
  cache:
    key: desktop-windows-v1
    paths:
      - .ci/cargo/registry/index
      - .ci/cargo/registry/cache
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci/build-desktop-windows.ps1

build-desktop-linux:
  extends: [.desktop-linux, .desktop-release]

build-desktop-windows:
  extends: [.desktop-windows, .desktop-release]

build-desktop-linux-mr:
  extends: [.desktop-linux, .desktop-mr]

build-desktop-windows-mr:
  extends: [.desktop-windows, .desktop-mr]

build-android:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  image: eclipse-temurin:21.0.13_9-jdk-noble
  tags: [saas-linux-medium-amd64]
  timeout: 1h
  cache:
    key: android-v2
    paths:
      - .ci/cargo/bin
      - .ci/cargo/.crates.toml
      - .ci/cargo/.crates2.json
      - .ci/cargo/registry/index
      - .ci/cargo/registry/cache
      - .ci/gradle/caches
      - .ci/gradle/wrapper
      - target/android
  script: ci/build-android.sh
  artifacts:
    paths: [dist/]
    expire_in: never

release:
  stage: release
  image: alpine:3.23.3
  needs: [build-linux, build-windows, build-android, build-desktop-linux, build-desktop-windows]
  rules:
    - if: $CI_COMMIT_TAG
  script: ci/release.sh
