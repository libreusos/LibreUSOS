name: Release

# Tag pushes build and publish a release; a manual run only builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-linux:
    runs-on: ubuntu-latest
    container: rust:1.99.1-alpine3.23
    environment: release
    steps:
      - run: apk add --no-cache git libstdc++
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/build-linux.sh
        env:
          USOS_POLSL_CONSUMER_KEY: ${{ secrets.USOS_POLSL_CONSUMER_KEY }}
          USOS_POLSL_CONSUMER_SECRET: ${{ secrets.USOS_POLSL_CONSUMER_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cli-linux
          path: dist/

  cli-windows:
    runs-on: ubuntu-latest
    container: rust:1.99.1-alpine3.23
    environment: release
    steps:
      - run: apk add --no-cache git libstdc++
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/build-windows.sh
        env:
          USOS_POLSL_CONSUMER_KEY: ${{ secrets.USOS_POLSL_CONSUMER_KEY }}
          USOS_POLSL_CONSUMER_SECRET: ${{ secrets.USOS_POLSL_CONSUMER_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cli-windows
          path: dist/

  desktop-linux:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/build-desktop-linux.sh
        env:
          USOS_POLSL_CONSUMER_KEY: ${{ secrets.USOS_POLSL_CONSUMER_KEY }}
          USOS_POLSL_CONSUMER_SECRET: ${{ secrets.USOS_POLSL_CONSUMER_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-linux
          path: dist/

  # GPUI compiles its Direct3D shaders with the Windows SDK's fxc.exe in a build script that only runs on
  # a Windows host, so this one builds natively (MSVC), not cross on Linux.
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    env:
      RUST_VERSION: "1.99.1"  # keep in sync with the rust:* images
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            .ci/cargo/registry/index
            .ci/cargo/registry/cache
          key: desktop-windows-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-windows-v1-
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File ci/build-desktop-windows.ps1
        env:
          USOS_POLSL_CONSUMER_KEY: ${{ secrets.USOS_POLSL_CONSUMER_KEY }}
          USOS_POLSL_CONSUMER_SECRET: ${{ secrets.USOS_POLSL_CONSUMER_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-windows
          path: dist/

  android:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21.0.13_9-jdk-noble
    timeout-minutes: 60
    environment: release
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: |
            .ci/cargo/bin
            .ci/cargo/.crates.toml
            .ci/cargo/.crates2.json
            .ci/cargo/registry/index
            .ci/cargo/registry/cache
            .ci/gradle/caches
            .ci/gradle/wrapper
            target/android
          key: android-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-v2-
      - run: ci/build-android.sh
        env:
          USOS_POLSL_CONSUMER_KEY: ${{ secrets.USOS_POLSL_CONSUMER_KEY }}
          USOS_POLSL_CONSUMER_SECRET: ${{ secrets.USOS_POLSL_CONSUMER_SECRET }}
          LIBREUSOS_KEYSTORE_PASSWORD: ${{ secrets.LIBREUSOS_KEYSTORE_PASSWORD }}
          LIBREUSOS_KEY_ALIAS: ${{ secrets.LIBREUSOS_KEY_ALIAS }}
          LIBREUSOS_KEYSTORE_B64: ${{ secrets.LIBREUSOS_KEYSTORE_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/

  release:
    if: github.ref_type == 'tag'
    needs: [cli-linux, cli-windows, desktop-linux, desktop-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ci/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
